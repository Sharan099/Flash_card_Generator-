name: Deploy to Hugging Face Space

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not configured."
            exit 1
          fi
          if [ -z "$HF_SPACE_REPO" ]; then
            echo "HF_SPACE_REPO variable is not configured."
            exit 1
          fi

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" hf-space

          rsync -av --delete \
            --exclude .git \
            --exclude .github \
            --exclude .venv \
            --exclude data \
            --exclude .env \
            --exclude __pycache__ \
            ./ hf-space/

          cd hf-space
          git add .
          if git diff --staged --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy from GitHub Actions (${{ github.event.workflow_run.head_sha }})"
          git push
